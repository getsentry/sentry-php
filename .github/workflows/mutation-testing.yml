name: Mutation Testing

# Says which of the tests a pull request adds could go again without anything going unnoticed. It never
# fails a pull request: the findings are warnings on the tests, a job summary and a comment.
# See scripts/mutation-testing/run.php.
#
# It only runs on pull requests that have the "mutation-testing" label. Every test it reports still has to
# be read next to the test it names, which is worth the time of whoever wrote the tests, not of every
# reviewer.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'tests/**'
      - 'scripts/mutation-testing/**'
      - '.github/workflows/mutation-testing.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  new-tests:
    name: New tests
    if: ${{ contains(github.event.pull_request.labels.*.name, 'mutation-testing') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      summary: ${{ steps.summary.outputs.summary }}

    steps:
      # The pull request's merge commit and its first parent, the base branch, are all the comparison needs.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          coverage: xdebug
          extensions: excimer
          tools: infection:0.35.10

      - name: Determine Composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: ${{ runner.os }}-8.5-composer-highest-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-8.5-highest-composer-

      # The same dependencies as the "Tests" job of ci.yml with the highest versions.
      - name: Remove unused dependencies
        run: composer remove carthage-software/mago phpstan/phpstan friendsofphp/php-cs-fixer --dev --no-interaction --no-update

      - name: Remove OpenTelemetry dependencies
        run: composer remove open-telemetry/api open-telemetry/context open-telemetry/exporter-otlp open-telemetry/gen-otlp-protobuf open-telemetry/sem-conv open-telemetry/sdk --dev --no-interaction --no-update

      - name: Set phpunit/phpunit version constraint
        run: composer require phpunit/phpunit:'^9.6.34' --dev --no-interaction --no-update

      - name: Install dependencies
        run: composer update --no-progress --no-interaction --prefer-dist

      # Tests that are not judged within the budget are reported as not measured. A crash or a timeout
      # here never fails the check.
      - name: Run the new tests against mutants
        id: run
        continue-on-error: true
        timeout-minutes: 25
        run: php scripts/mutation-testing/run.php --base=HEAD^1 --out="$RUNNER_TEMP/mutation-testing" --workers="$(nproc)" --budget=900

      - name: Write the job summary
        id: summary
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
        run: |
          summary="$RUNNER_TEMP/mutation-testing/summary.md"
          if [[ "$RUN_OUTCOME" != success || ! -f "$summary" ]]; then
            mkdir -p "$(dirname "$summary")"
            printf '## New tests under mutation testing\n\nThe run did not finish, so the new tests were not measured. The job log has the details.\n' > "$summary"
          fi
          tee -a "$GITHUB_STEP_SUMMARY" < "$summary"
          { echo 'summary<<MUTATION_TESTING_EOF'; cat "$summary"; echo 'MUTATION_TESTING_EOF'; } >> "$GITHUB_OUTPUT"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-testing
          path: |
            ${{ runner.temp }}/mutation-testing/summary.md
            ${{ runner.temp }}/mutation-testing/report.json
          if-no-files-found: ignore

  comment:
    name: Comment the tests that could go
    needs: new-tests
    # Pull requests from forks get a read-only token, so they only get the warnings and the job summary.
    if: ${{ !cancelled() && needs.new-tests.result != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # The job above runs the pull request's code with a read-only token. This one runs none of it.
    permissions:
      pull-requests: write

    steps:
      # Only starts a comment when a test is reported, but keeps an existing one up to date, so a test
      # that was removed or improved no longer shows.
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUMMARY: ${{ needs.new-tests.outputs.summary }}
        run: |
          [[ -n "$SUMMARY" ]] || exit 0
          marker='<!-- mutation-testing -->'
          body="$marker
          $SUMMARY

          [Run]($RUN_URL)"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          elif grep -q '^### ' <<< "$SUMMARY"; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
