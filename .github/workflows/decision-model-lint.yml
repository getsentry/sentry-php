name: Decision model lint

# Never pull_request_target, which would give the PR's code the key.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint PR
    # Branches in this repo only, so employees and internal bots but never forks. Every label
    # change re-runs the lint, because a skipped run would replace the last result.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      LABEL: 'Trigger: Override Decision Model Lint'
    steps:
      # The PR's merge commit and its first parent: HEAD^1..HEAD is exactly what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - run: npm ci --prefix decision-model-linter --ignore-scripts

      - name: Lint
        env:
          OPENROUTER_API_KEY: ${{ secrets.DECISION_MODEL_LINTER_OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          OVERRIDDEN: ${{ contains(github.event.pull_request.labels.*.name, env.LABEL) }}
        run: scripts/decision-model-lint.sh
