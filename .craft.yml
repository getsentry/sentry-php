minVersion: 3.9.0
github:
  owner: getsentry
  repo: sentry-php
changelog:
  policy: simple
preReleaseCommand: bash scripts/bump-version.sh
versioning:
  policy: manual
statusProvider:
  name: github
artifactProvider:
  name: none
targets:
  - name: github
  - name: registry
    type: sdk
    config:
      canonical: 'composer:sentry/sentry'
